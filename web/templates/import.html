{{define "content"}}
<h1>Import a deck</h1>
{{template "errorMsg" .Error}}
<form method="post" action="/import" enctype="multipart/form-data">
    <label for="file">.apkg or .colpkg file</label>
    <input type="file" id="file" name="file" accept=".apkg,.colpkg" required>

    <button type="submit">Import</button>
</form>
<p><a href="/import/ai">Import cards made by an AI</a> instead?</p>
{{template "backToDecks"}}
{{end}}
