{{define "content"}}
{{range .CSS}}<style>{{.}}</style>{{end}}

<h1>{{.Deck.Name}}</h1>
{{template "backToDeck" .Deck}}

<p id="review-error" hidden></p>

<p x-data="{ count: 0 }" @card-graded.window="count++" x-show="count > 0" x-cloak>
  <small><span x-text="count"></span> reviewed this session</small>
</p>

<section id="review-stage" hidden class="review-card deckshare-card">
  <div class="card-question"></div>
  <div class="card-answer" hidden></div>
  <p>
    <button type="button" data-reveal>Show Answer</button>
  </p>
  <p class="rating-buttons" hidden>
    <button type="button" data-rating="1">Again <small data-interval-for="1"></small></button>
    <button type="button" data-rating="2">Hard <small data-interval-for="2"></small></button>
    <button type="button" data-rating="3">Good <small data-interval-for="3"></small></button>
    <button type="button" data-rating="4">Easy <small data-interval-for="4"></small></button>
  </p>
  <p class="flag-control">
    <button type="button" class="outline" data-flag-toggle>🚩 Flag this card</button>
    <span data-flag-form hidden>
      <textarea data-flag-comment maxlength="2000" placeholder="What's wrong with this card?"></textarea>
      <input type="hidden" data-flag-card-id>
      <button type="button"
              hx-post="/decks/{{.Deck.ID}}/cards/flags"
              hx-trigger="click[document.querySelector('[data-flag-comment]').value.trim() !== '']"
              hx-vals="js:{cardId: document.querySelector('[data-flag-card-id]').value, comment: document.querySelector('[data-flag-comment]').value}"
              hx-target="[data-flag-status]" hx-swap="innerHTML">Submit</button>
      <button type="button" data-flag-cancel>Cancel</button>
    </span>
    <span data-flag-status></span>
  </p>
</section>

<div id="review-queue">{{template "review_cards" .Batch}}</div>

<div id="review-refill" hidden
     hx-get="/api/reviews/next"
     hx-trigger="refill-needed from:body"
     hx-vals='js:{deck: deckshareReview.deckId(), cursor: deckshareReview.cursor(), extraRounds: deckshareReview.extraRounds()}'
     hx-target="#review-queue"
     hx-swap="beforeend"></div>

<section id="review-done" hidden>
  <p>No more cards due. Nice work.</p>
  <p><button type="button" id="study-more">Keep studying</button></p>
  <nav class="button-nav">
    <a href="/decks" role="button" class="btn-sm">Back to home</a>
    <a href="/decks/{{.Deck.ID}}" role="button" class="outline btn-sm">Back to deck</a>
  </nav>
</section>

<script src="/static/review.js" defer data-deck-id="{{.Deck.ID}}" data-user-id="{{.User.ID}}"></script>
{{end}}
