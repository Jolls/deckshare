{{define "layout"}}<!doctype html>
<html lang="en"{{with .User}}{{if eq .ColorScheme "light" "dark"}} data-theme="{{.ColorScheme}}"{{end}}{{end}}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeckShare</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/alpine.min.js" defer></script>
</head>
<body class="{{.BodyClass}}">
    <main class="container">
        {{if .User}}{{template "header" .}}{{end}}
        {{template "content" .}}
    </main>
    {{if .User}}<footer class="container app-footer"><small><a href="/release-notes">Version {{appVersion}}</a></small></footer>{{end}}
</body>
</html>
{{end}}
